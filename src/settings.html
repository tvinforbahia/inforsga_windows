<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Painel TV - Configuração</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#111827;color:#f9fafb;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
    .box{width:min(720px,92vw);background:#1f2937;padding:36px;border-radius:18px;box-shadow:0 18px 60px #0008}
    h1{margin:0 0 8px;font-size:34px}
    p{color:#cbd5e1;line-height:1.5}
    label{display:block;margin:24px 0 8px;font-weight:bold}
    input{width:100%;font-size:20px;padding:15px 16px;border-radius:10px;border:1px solid #4b5563;background:#111827;color:white;outline:none}
    input:focus{border-color:#93c5fd}
    .buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
    button{font-size:18px;padding:13px 22px;border:0;border-radius:10px;cursor:pointer}
    .primary{background:#2563eb;color:white}
    .secondary{background:#374151;color:white}
    #msg{min-height:22px;margin-top:14px;color:#fca5a5}
    .help{font-size:14px;color:#94a3b8;margin-top:26px}
  </style>
</head>
<body>
  <div class="box">
    <h1>Painel TV para Windows</h1>
    <p>Informe o endereço do Painel TV. O aplicativo abrirá em tela cheia e permitirá reprodução automática de áudio e voz.</p>
    <label for="url">URL do painel</label>
    <input id="url" placeholder="http://192.168.1.10/paineltv/" autocomplete="off">
    <div class="buttons">
      <button class="primary" id="save">Salvar e abrir painel</button>
      <button class="secondary" id="exit">Sair</button>
    </div>
    <div id="msg"></div>
    <div class="help">Atalhos: F11 = tela cheia · F5 = atualizar · Ctrl+Shift+S = configurações · Alt+F4 = sair</div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    window.painelTV.getConfig().then(cfg => {
      if (cfg && cfg.url) $('url').value = cfg.url;
    });
    $('save').addEventListener('click', async () => {
      $('msg').textContent = '';
      const result = await window.painelTV.saveConfig({ url: $('url').value });
      if (!result.ok) $('msg').textContent = result.error || 'Não foi possível salvar.';
    });
    $('url').addEventListener('keydown', e => {
      if (e.key === 'Enter') $('save').click();
    });
    $('exit').addEventListener('click', () => window.painelTV.exitApp());
  </script>
</body>
</html>
